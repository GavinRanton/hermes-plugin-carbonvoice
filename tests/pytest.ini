[pytest]
# The repo root ships an __init__.py (the Hermes plugin entry point, which
# imports gateway.* — only present inside an installed Hermes). If pytest's
# rootdir were the repo root it would build a Package node for it and import
# that __init__.py during setup, which fails outside Hermes. Keeping this ini
# inside tests/ pins rootdir here so collection never ascends into the package
# root. importlib import-mode keeps each test module self-contained.
addopts = --import-mode=importlib
python_files = test_*.py
